<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main Window</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f5f5f5;
    }

    h1 {
      margin-top: 0;
    }

    textarea {
      width: 100%;
      max-width: 900px;
      height: 320px;
      display: block;
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
      resize: vertical;
    }

    button {
      margin-top: 12px;
      margin-right: 8px;
      padding: 10px 18px;
      font-size: 15px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      padding: 12px;
      max-width: 900px;
      background: white;
      border: 1px solid #ccc;
      min-height: 24px;
    }
  </style>
</head>
<body>
  <h1>Main Window</h1>

  <label for="mainText">Enter text:</label>
  <textarea id="mainText" placeholder="Write your text here..."></textarea>

  <button id="newWindowBtn">NEW WINDOW</button>
  <button id="sendBtn">SEND</button>

  <p id="result">Result</p>

  <script>
    let popupWindow = null;

    document.getElementById("newWindowBtn").addEventListener("click", function () {
      const width = 500;
      const height = 500;
      const left = window.screen.availWidth - width;
      const top = 0;

      popupWindow = window.open(
        "",
        "TextVerifierWindow",
        `width=${width},height=${height},left=${left},top=${top}`
      );

      if (!popupWindow) {
        alert("Popup was blocked. Please allow popups for this page.");
        return;
      }

      popupWindow.document.open();
      popupWindow.document.write(`
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8" />
          <title>New Window</title>
          <style>
            body {
              font-family: Arial, sans-serif;
              margin: 20px;
              background: #f5f5f5;
            }

            h1 {
              margin-top: 0;
            }

            textarea {
              width: 100%;
              height: 320px;
              padding: 12px;
              font-size: 16px;
              box-sizing: border-box;
              resize: vertical;
            }

            button {
              margin-top: 12px;
              padding: 10px 18px;
              font-size: 15px;
              cursor: pointer;
            }
          </style>
        </head>
        <body>
          <h1>New Window</h1>

          <label for="popupText">Received text:</label>
          <textarea id="popupText" placeholder="Text from the main window will appear here..."></textarea>

          <button id="verifyBtn">VERIFY</button>

          <script>
            window.addEventListener("message", function (event) {
              if (event.data && event.data.type === "SEND_TEXT") {
                document.getElementById("popupText").value = event.data.text;
              }
            });

            document.getElementById("verifyBtn").addEventListener("click", function () {
              const text = document.getElementById("popupText").value;

              const lowercaseA = (text.match(/a/g) || []).length;
              const uppercaseA = (text.match(/A/g) || []).length;

              if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                  type: "VERIFY_RESULT",
                  lowercaseA: lowercaseA,
                  uppercaseA: uppercaseA,
                  total: lowercaseA + uppercaseA
                }, "*");
              }
            });
          <\/script>
        </body>
        </html>
      `);
      popupWindow.document.close();
    });

    document.getElementById("sendBtn").addEventListener("click", function () {
      if (!popupWindow || popupWindow.closed) {
        alert("Please open the new window first.");
        return;
      }

      const text = document.getElementById("mainText").value;

      popupWindow.postMessage({
        type: "SEND_TEXT",
        text: text
      }, "*");
    });

    window.addEventListener("message", function (event) {
      if (event.data && event.data.type === "VERIFY_RESULT") {
        document.getElementById("result").textContent =
          `The text contains ${event.data.lowercaseA} lowercase "a" letters, ` +
          `${event.data.uppercaseA} uppercase "A" letters, ` +
          `and ${event.data.total} total "a/A" letters.`;
      }
    });
  </script>
</body>
</html>
